- name: Install Streams for Apache Kafka Console Operator
  ansible.builtin.include_role:
    name: install_operator
  vars:
    install_operator_action: install
    install_operator_name: amq-streams-console
    install_operator_namespace: "{{ amq_streams_console_operator_namespace }}"
    install_operator_channel: "{{ amq_streams_console_operator_channel }}"
    install_operator_csv_nameprefix: amq-streams-console
    install_operator_catalog: redhat-operators
    install_operator_automatic_install_plan_approval: true
    install_operator_starting_csv: "{{ amq_streams_console_operator_starting_csv }}"
    install_operator_catalogsource_setup: false
    install_operator_catalogsource_namespace: openshift-operators
